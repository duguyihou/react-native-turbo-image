// TurboImage 2.0 — Android library build.
//
// Toolchain contract (docs/compatibility-matrix.md):
//   * AGP / NDK / compileSdk come from the host app (`rootProject.ext`), with
//     defaults matching React Native 0.88.1's own `libs.versions.toml`.
//   * Kotlin: Coil 3.6.3 is compiled with Kotlin 2.4.10. A Kotlin compiler
//     only reads metadata up to one minor version ahead, so the host app's
//     Kotlin must be >= 2.3. RN 0.88's template ships 2.2.0, so apps have to
//     raise it. We fail fast below instead of letting the build die later
//     with a wall of "incompatible metadata" errors in some other library.
//   * Shared C++ core is built with CMake from ../cpp (RFC rule 4).

buildscript {
  ext.TurboImage = [
    kotlinVersion    : "2.4.21",
    minSdkVersion    : 24,
    compileSdkVersion: 37,
    targetSdkVersion : 36,
    ndkVersion       : "27.1.12297006",
  ]
  ext.getExtOrDefault = { prop ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : TurboImage[prop]
  }
  // Intentionally no `classpath` entries: AGP, KGP and the RN Gradle plugin
  // come from the host app's root buildscript. Declaring them here as well
  // either fails to resolve (versionless) or silently forks the plugin
  // version from the app's (versioned). The library is always built inside
  // an app; CI uses apps/example.
}

// Pinned production versions (RFC rule 7). Must match
// scripts/native-versions.env; scripts/check-native-versions.sh enforces it.
def coilVersion = "3.6.3"
// LINE apng-drawable; must match scripts/native-versions.env.
def apngDrawableVersion = "1.12.0"
def minimumKotlinForCoil = "2.3.0"
// The instrumented tests' own dependencies (src/androidTest). Not part of
// what an app gets; pinned like the rest, in scripts/native-versions.env.
def androidxTestVersion = "1.7.0"
def androidxTestJunitVersion = "1.3.0"
def junitVersion = "4.13.2"

// Compares major.minor only (patch and -RC suffixes do not affect metadata
// compatibility). Hand-rolled because Gradle 9 removed `VersionNumber`.
def majorMinor = { String v ->
  def parts = v.tokenize(".-")
  parts[0].toInteger() * 1000 + parts[1].toInteger()
}

def reactNativeArchitectures() {
  def value = rootProject.findProperty("reactNativeArchitectures")
  return value ? value.toString().split(",").collect { it.trim() } :
    ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
// AGP 9 can register Kotlin itself (`android.builtInKotlin=true`); applying
// the plugin again would fail with a duplicate `kotlin` extension.
if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}
apply plugin: "com.facebook.react"

// The Kotlin that matters is the compiler's, which is the Kotlin Gradle
// plugin's version, and that comes from the app's buildscript classpath.
// `rootProject.ext.kotlinVersion` is only a convention: React Native's
// template declares the plugin without a version, so raising the ext
// property alone leaves the compiler where it was. Checking the property
// let exactly that through, and the build then failed in whichever library
// compiled first. So ask the plugin, and fall back to the property only if
// no applied plugin reports a version.
def kotlinPlugin = project.plugins.find { it.metaClass.respondsTo(it, "getPluginVersion") }
def appKotlin = (kotlinPlugin?.pluginVersion ?: getExtOrDefault("kotlinVersion")).toString()
if (majorMinor(appKotlin) < majorMinor(minimumKotlinForCoil)) {
  throw new GradleException(
    "react-native-turbo-image requires Kotlin >= ${minimumKotlinForCoil} " +
    "(Coil ${coilVersion} is compiled with Kotlin 2.4), but this build uses the Kotlin " +
    "Gradle plugin ${appKotlin}. In android/build.gradle, set `kotlinVersion` in `ext {}` " +
    "and give the plugin that version: " +
    "classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlinVersion\")."
  )
}

android {
  namespace "com.turboimage"
  compileSdk getExtOrDefault("compileSdkVersion")
  ndkVersion getExtOrDefault("ndkVersion")

  defaultConfig {
    minSdk getExtOrDefault("minSdkVersion")
    targetSdk getExtOrDefault("targetSdkVersion")
    consumerProguardFiles "consumer-rules.pro"
    // For src/androidTest: the adapter's tests, run on a device or emulator
    // by scripts/test-android-adapter.sh.
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    // The same ABIs for what is packaged as for what CMake builds. This only
    // narrows anything in the test APK, which would otherwise carry React
    // Native's libraries for all four ABIs whatever the device (about 60 MB
    // more, enough to fail the install on a nearly full emulator).
    ndk {
      abiFilters(*reactNativeArchitectures())
    }
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
        // Warnings in the C++ are errors only where asked for: this
        // repository's example app sets the property; an app compiling
        // with a newer NDK must not fail on a warning (cpp/CMakeLists.txt).
        if (rootProject.findProperty("turboImage.warningsAsErrors") == "true") {
          arguments "-DTURBOIMAGE_WARNINGS_AS_ERRORS=ON"
        }
        // Honour the app's `-PreactNativeArchitectures=...`. The RN Gradle
        // plugin narrows ABIs only for the app module; without this, the
        // library compiles the core for all four ABIs on every build.
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildTypes {
    release {
      // Libraries are not minified themselves; R8 runs in the app, guided
      // by consumer-rules.pro. The example's release build is the R8 test.
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    disable "GradleCompatible"
  }

  // Only the test APK (src/androidTest) packages native libraries from this
  // module: an app packages its own. React Native and the core both ship the
  // C++ runtime, and an app's build picks one through React Native's Gradle
  // plugin; the library's test APK has to say so itself. The copies are the
  // same NDK's runtime (both built with c++_shared).
  packaging {
    jniLibs {
      pickFirsts += ["**/libc++_shared.so"]
    }
  }
}

if (project.extensions.findByName("kotlin") != null) {
  kotlin {
    jvmToolchain(17)
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // coil-core, not `coil`: the `coil` artifact adds a process-wide singleton
  // ImageLoader, and TurboImage must not share cache state with the host app
  // (mirrors the dedicated Nuke pipeline on iOS).
  implementation "io.coil-kt.coil3:coil-core:${coilVersion}"
  implementation "io.coil-kt.coil3:coil-network-okhttp:${coilVersion}"
  // HTTP freshness and revalidation for `cachePolicy="urlCache"`; the other
  // policies keep Coil's default strategy, which ignores Cache-Control.
  implementation "io.coil-kt.coil3:coil-network-cache-control:${coilVersion}"
  // Animated GIF/WebP/HEIF (AnimatedImageDecoder on API 28+, GifDecoder below)
  // and SVG (AndroidSVG). Same version as Coil, like iOS's single Nuke pin.
  implementation "io.coil-kt.coil3:coil-gif:${coilVersion}"
  implementation "io.coil-kt.coil3:coil-svg:${coilVersion}"
  // APNG: see loader/ApngDecoder.kt. Its .so files are 16 KB-aligned for
  // arm64-v8a and x86_64 (checked for 1.12.0).
  implementation "com.linecorp:apng:${apngDrawableVersion}"

  androidTestImplementation "junit:junit:${junitVersion}"
  androidTestImplementation "androidx.test:runner:${androidxTestVersion}"
  // ActivityScenario: Coil sizes a decode from a laid-out view and cancels a
  // load whose view is detached, so the tests need a real window.
  androidTestImplementation "androidx.test:core:${androidxTestVersion}"
  androidTestImplementation "androidx.test.ext:junit:${androidxTestJunitVersion}"
}
