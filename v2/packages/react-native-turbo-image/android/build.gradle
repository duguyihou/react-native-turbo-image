// TurboImage Android library (toolchain: docs/compatibility-matrix.md).
// AGP, NDK and compileSdk come from the host app; defaults match RN 0.88.1.
// Coil is built with Kotlin 2.4, so the app needs Kotlin >= 2.3; checked below.

buildscript {
  ext.TurboImage = [
    kotlinVersion    : "2.4.21",
    minSdkVersion    : 24,
    compileSdkVersion: 37,
    targetSdkVersion : 36,
    ndkVersion       : "27.1.12297006",
  ]
  ext.getExtOrDefault = { prop ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : TurboImage[prop]
  }
  // No `classpath` entries on purpose: AGP, KGP and the RN plugin come from
  // the host app; declaring them here would fail or fork their versions.
}

// Pinned versions (RFC rule 7); must match scripts/native-versions.env.
def coilVersion = "3.6.3"
// LINE apng-drawable.
def apngDrawableVersion = "1.12.0"
def minimumKotlinForCoil = "2.3.0"
// Oldest supported React Native (MIN_REACT_NATIVE_VERSION).
def minimumReactNative = "0.88"
// Instrumented test dependencies only; not shipped to apps.
def androidxTestVersion = "1.7.0"
def androidxTestJunitVersion = "1.3.0"
def junitVersion = "4.13.2"

// major.minor only. Hand-rolled because Gradle 9 removed `VersionNumber`.
def majorMinor = { String v ->
  def parts = v.tokenize(".-")
  parts[0].toInteger() * 1000 + parts[1].toInteger()
}

def reactNativeArchitectures() {
  def value = rootProject.findProperty("reactNativeArchitectures")
  return value ? value.toString().split(",").collect { it.trim() } :
    ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"
// AGP 9 may register Kotlin itself; applying it twice would fail.
if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}
apply plugin: "com.facebook.react"

// Check the Kotlin plugin's own version, not `ext.kotlinVersion`: RN's
// template applies the plugin unversioned, so the ext property can lie.
def kotlinPlugin = project.plugins.find { it.metaClass.respondsTo(it, "getPluginVersion") }
def appKotlin = (kotlinPlugin?.pluginVersion ?: getExtOrDefault("kotlinVersion")).toString()
if (majorMinor(appKotlin) < majorMinor(minimumKotlinForCoil)) {
  throw new GradleException(
    "react-native-turbo-image requires Kotlin >= ${minimumKotlinForCoil} " +
    "(Coil ${coilVersion} is compiled with Kotlin 2.4), but this build uses the Kotlin " +
    "Gradle plugin ${appKotlin}. In android/build.gradle, set `kotlinVersion` in `ext {}` " +
    "and give the plugin that version: " +
    "classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlinVersion\")."
  )
}

// Checked here because the npm peer range is `*` (react-native-tvos versions
// are pre-releases). Walks up like Node's resolver, so hoisted monorepos work.
def findReactNativeVersion = {
  for (def dir = projectDir; dir != null; dir = dir.parentFile) {
    def manifest = new File(dir, "node_modules/react-native/package.json")
    if (manifest.isFile()) {
      return new groovy.json.JsonSlurper().parse(manifest).version?.toString()
    }
  }
  return null
}
def reactNativeVersion = findReactNativeVersion()
if (reactNativeVersion == null) {
  logger.warn("react-native-turbo-image: could not find react-native's package.json above ${projectDir}; " +
    "skipping the React Native version check (>= ${minimumReactNative} is required).")
} else if (reactNativeVersion.startsWith("0.0.0")) {
  // A nightly: no version to compare, and newer than any release.
} else if (majorMinor(reactNativeVersion) < majorMinor(minimumReactNative)) {
  throw new GradleException(
    "react-native-turbo-image 2.x requires React Native >= ${minimumReactNative} (New Architecture), " +
    "but this app uses ${reactNativeVersion}. Upgrade React Native, or stay on react-native-turbo-image 1.x."
  )
}

android {
  namespace "com.turboimage"
  compileSdk getExtOrDefault("compileSdkVersion")
  ndkVersion getExtOrDefault("ndkVersion")

  defaultConfig {
    minSdk getExtOrDefault("minSdkVersion")
    targetSdk getExtOrDefault("targetSdkVersion")
    consumerProguardFiles "consumer-rules.pro"
    // For src/androidTest (scripts/test-android-adapter.sh).
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    // Keeps the test APK from packaging RN's libraries for all four ABIs.
    ndk {
      abiFilters(*reactNativeArchitectures())
    }
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared"
        // Opt-in only, so apps on a newer NDK don't fail on new warnings.
        if (rootProject.findProperty("turboImage.warningsAsErrors") == "true") {
          arguments "-DTURBOIMAGE_WARNINGS_AS_ERRORS=ON"
        }
        // Honour `-PreactNativeArchitectures`; RN's plugin only narrows the app.
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildTypes {
    release {
      // R8 runs in the app, guided by consumer-rules.pro.
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  lint {
    disable "GradleCompatible"
  }

  // For the test APK only: RN and the core both ship libc++_shared.so
  // (same NDK runtime); apps pick one via RN's plugin.
  packaging {
    jniLibs {
      pickFirsts += ["**/libc++_shared.so"]
    }
  }
}

if (project.extensions.findByName("kotlin") != null) {
  kotlin {
    jvmToolchain(17)
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  // coil-core, not `coil`: avoid the app-wide singleton ImageLoader and its cache.
  implementation "io.coil-kt.coil3:coil-core:${coilVersion}"
  implementation "io.coil-kt.coil3:coil-network-okhttp:${coilVersion}"
  // HTTP Cache-Control for `cachePolicy="urlCache"` only.
  implementation "io.coil-kt.coil3:coil-network-cache-control:${coilVersion}"
  // Animated GIF/WebP/HEIF and SVG.
  implementation "io.coil-kt.coil3:coil-gif:${coilVersion}"
  implementation "io.coil-kt.coil3:coil-svg:${coilVersion}"
  // APNG (loader/ApngDecoder.kt); its .so files are 16 KB-aligned.
  implementation "com.linecorp:apng:${apngDrawableVersion}"

  androidTestImplementation "junit:junit:${junitVersion}"
  androidTestImplementation "androidx.test:runner:${androidxTestVersion}"
  // ActivityScenario: Coil needs a laid-out, attached view.
  androidTestImplementation "androidx.test:core:${androidxTestVersion}"
  androidTestImplementation "androidx.test.ext:junit:${androidxTestJunitVersion}"
}
