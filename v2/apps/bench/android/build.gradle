buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        // Raised from RN 0.88's default 2.2.0: Coil 3.6.3 is compiled with
        // Kotlin 2.4.10, and a 2.2 compiler cannot read 2.4 metadata.
        // 2.4.20, not the example's 2.4.21 (KOTLIN_VERSION in
        // v2/scripts/native-versions.env): Expo publishes its Kotlin
        // compiler plugins (pika-compiler, expo-modules-v2-compiler-plugin)
        // per Kotlin version, and SDK 58 has none for 2.4.21.
        kotlinVersion = "2.4.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Expo's root plugin goes before React Native's, as in Expo's bare template.
apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
