buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        // Above RN's default: Coil needs Kotlin 2.4 metadata. 2.4.20, not
        // KOTLIN_VERSION, because Expo SDK 58's compiler plugins lack 2.4.21.
        kotlinVersion = "2.4.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Expo's root plugin goes before React Native's, as in Expo's bare template.
apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
