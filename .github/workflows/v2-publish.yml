# Publishes TurboImage 2.x (v2/packages/react-native-turbo-image) to npm.
#
# Trigger: push a tag `v<version>` matching the package's version, e.g.
#   git tag v2.0.0-beta.1 && git push origin v2.0.0-beta.1
# or run it by hand (Actions → v2 publish), which is a dry run unless told
# otherwise. 1.x tags (`v1.*`) are released with release-it from `main` and
# never reach this workflow.
#
# Authentication is npm's trusted publishing (OIDC): no token is stored here,
# and npm attaches a provenance attestation to every version. It needs a
# one-time setting on npmjs.com: react-native-turbo-image → Settings →
# Trusted publisher → GitHub Actions, repository duguyihou/react-native-turbo-image,
# workflow `v2-publish.yml`.
#
# What it refuses to publish:
#   * a version whose tag does not match package.json;
#   * a commit without a successful `v2 CI` run: the tests are not repeated
#     here, they are required to have passed;
#   * a stable version. Pre-releases go out under the `next` dist-tag (the
#     package's `publishConfig`), so `npm install react-native-turbo-image`
#     keeps giving 1.x. Making 2.0.0 `latest` moves every 1.x user who
#     upgrades, a decision to take when 2.0.0 is ready.
#     TODO: a stable path (dist-tag `latest`, and a GitHub release).
name: v2 publish

on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and check everything, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

# One publish at a time, and never cancelled halfway.
concurrency:
  group: v2-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: v2

env:
  # Keep in sync with v2-ci.yml.
  BUN_VERSION: 1.3.13
  NODE_VERSION: 22.14.0
  XCODE_VERSION: '27.2'
  # Trusted publishing needs npm 11.5.1 or newer; Node 22.14 ships npm 10.
  NPM_VERSION: 11.6.2

jobs:
  publish:
    name: Publish to npm
    # macOS: the package ships the Nuke and NukeUI xcframeworks, built here
    # from the pinned tag (scripts/build-nuke-xcframework.sh).
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: read
      # Reads the CI result for this commit.
      actions: read
      # The OIDC token npm's trusted publishing exchanges for a publish.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: '${{ env.BUN_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global "npm@${NPM_VERSION}"

      - name: Decide what is being published
        id: version
        run: |
          version="$(node -p 'require("./packages/react-native-turbo-image/package.json").version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})."
            exit 1
          fi
          if [[ "${version}" != *-* ]]; then
            echo "::error::${version} is not a pre-release. This workflow publishes pre-releases only, under the 'next' dist-tag; see the TODO at the top of v2-publish.yml."
            exit 1
          fi
          # A tag push publishes; a manual run only when asked to.
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${{ inputs.dry-run }}" == "false" ]]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Publishing ${version} (dry run: $(grep -o 'dry_run=.*' "$GITHUB_OUTPUT" | cut -d= -f2))"

      - name: Require a green v2 CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The most recent completed run of v2-ci.yml for exactly this commit.
          conclusion="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow v2-ci.yml \
            --commit "${GITHUB_SHA}" --status completed --limit 1 \
            --json conclusion --jq '.[0].conclusion // ""')"
          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::No successful v2 CI run for ${GITHUB_SHA} (latest: '${conclusion:-none}'). Wait for CI, or push the commit to a pull request first."
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bash scripts/check-native-versions.sh

      # As in v2-ci.yml: built from source on a miss, several minutes per
      # platform. The pack guard below checks the restored version.
      - name: Cache the Nuke and NukeUI xcframeworks
        id: nuke-cache
        uses: actions/cache@v6
        with:
          path: v2/packages/react-native-turbo-image/ios/vendor
          key: nuke-xcframeworks-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('v2/scripts/native-versions.env', 'v2/scripts/build-nuke-xcframework.sh') }}
      - name: Build pinned Nuke and NukeUI xcframeworks
        if: steps.nuke-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-nuke-xcframework.sh

      # `npm publish` runs the package's `prepack` (type declarations, then
      # scripts/check-pack.sh: vendored frameworks present and at the pinned
      # version, LICENSE and README in place), and fails if it does.
      - name: Publish
        working-directory: v2/packages/react-native-turbo-image
        run: |
          args=(--access public --tag next)
          if [[ "${{ steps.version.outputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          npm publish "${args[@]}"
