# Publishes TurboImage 2.x to npm.
#
# Trigger: push a `v<version>` tag matching package.json (e.g. v2.0.0-beta.1),
# or run by hand (dry run by default). 1.x is released separately.
#
# Auth: npm trusted publishing (OIDC, with provenance), set up once on
# npmjs.com for repository duguyihou/react-native-turbo-image and workflow
# `v2-publish.yml`.
#
# Refuses: a tag that doesn't match package.json, a commit without a green
# `v2 CI` run, and stable versions (pre-releases go to `next`, so `latest`
# stays on 1.x).
# TODO: a stable path (dist-tag `latest`, and a GitHub release).
name: v2 publish

on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and check everything, publish nothing
        type: boolean
        default: true

permissions:
  contents: read

# One publish at a time, and never cancelled halfway.
concurrency:
  group: v2-publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: v2

env:
  # Keep in sync with v2-ci.yml.
  BUN_VERSION: 1.3.13
  NODE_VERSION: 22.14.0
  XCODE_VERSION: '27.2'
  # Trusted publishing needs npm 11.5.1 or newer; Node 22.14 ships npm 10.
  NPM_VERSION: 11.6.2

jobs:
  publish:
    name: Publish to npm
    # macOS, to build the vendored Nuke xcframeworks.
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: read
      # Reads the CI result for this commit.
      actions: read
      # OIDC token for trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - run: sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version: '${{ env.BUN_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global "npm@${NPM_VERSION}"

      - name: Decide what is being published
        id: version
        run: |
          version="$(node -p 'require("./packages/react-native-turbo-image/package.json").version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})."
            exit 1
          fi
          if [[ "${version}" != *-* ]]; then
            echo "::error::${version} is not a pre-release. This workflow publishes pre-releases only, under the 'next' dist-tag; see the TODO at the top of v2-publish.yml."
            exit 1
          fi
          # A tag push publishes; a manual run only when asked to.
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${{ inputs.dry-run }}" == "false" ]]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Publishing ${version} (dry run: $(grep -o 'dry_run=.*' "$GITHUB_OUTPUT" | cut -d= -f2))"

      - name: Require a green v2 CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Latest completed v2 CI run for this commit.
          conclusion="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow v2-ci.yml \
            --commit "${GITHUB_SHA}" --status completed --limit 1 \
            --json conclusion --jq '.[0].conclusion // ""')"
          if [[ "${conclusion}" != "success" ]]; then
            echo "::error::No successful v2 CI run for ${GITHUB_SHA} (latest: '${conclusion:-none}'). Wait for CI, or push the commit to a pull request first."
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bash scripts/check-native-versions.sh

      # As in v2-ci.yml; the pack guard checks the restored version.
      - name: Cache the Nuke and NukeUI xcframeworks
        id: nuke-cache
        uses: actions/cache@v6
        with:
          path: v2/packages/react-native-turbo-image/ios/vendor
          key: nuke-xcframeworks-xcode-${{ env.XCODE_VERSION }}-${{ hashFiles('v2/scripts/native-versions.env', 'v2/scripts/build-nuke-xcframework.sh') }}
      - name: Build pinned Nuke and NukeUI xcframeworks
        if: steps.nuke-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-nuke-xcframework.sh

      # `npm publish` runs `prepack` (types, then check-pack.sh).
      - name: Publish
        working-directory: v2/packages/react-native-turbo-image
        run: |
          args=(--access public --tag next)
          if [[ "${{ steps.version.outputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          npm publish "${args[@]}"
